# Copy to secret.yaml (gitignored, same discipline as .env and
# terraform.tfvars) and fill in real values, or create it imperatively
# instead so nothing sensitive ever touches disk as a committed file:
#   kubectl create secret generic netconfig-assistant-secret \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=ANTHROPIC_API_KEY='sk-...'
#
# For local minikube testing, DATABASE_URL points at the same docker-compose
# Postgres this project already uses locally, reached via minikube's
# host-bridge DNS name (not localhost - the pod isn't the host) and the
# host-mapped port 5433. A real deployment would point this at the
# Terraform-provisioned RDS endpoint instead.
apiVersion: v1
kind: Secret
metadata:
  name: netconfig-assistant-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://netconfig:devpassword@host.minikube.internal:5433/netconfig"
  ANTHROPIC_API_KEY: "replace-with-a-real-key"
