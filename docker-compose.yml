# Local dev database only. RDS is the deployment target (Week 5) — this is
# the dev loop, matching growth-os's local-first dev pattern.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: netconfig
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: netconfig
    ports:
      - "5433:5432" # non-default host port so this can't collide with another local Postgres
    volumes:
      - netconfig_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconfig"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  netconfig_pgdata:
