[project]
name = "netconfig-assistant"
version = "0.1.0"
description = "RAG assistant over Cisco IOS configuration references (RFCs + original notes), with mandatory citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastembed>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "deepeval>=1.0",
]

[tool.setuptools]
# setuptools' flat-layout auto-discovery sees app/, corpus/, terraform/ as
# equally plausible top-level packages on a full checkout and refuses to
# guess (confirmed by a real CI failure, not anticipated) - only app/ is
# ever meant to be installed.
packages = ["app", "app.models", "app.routers", "app.schemas", "app.services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped, not the pytest-asyncio default of one new loop per test
# function: app.database's async engine (and its asyncpg connection pool) is
# created once at module-import time. A fresh loop per test invalidates that
# pool's connections after the first test closes its loop - real bug, found
# by the first full-suite run cascading InterfaceError from test 2 onward.
asyncio_default_fixture_loop_scope = "session"
